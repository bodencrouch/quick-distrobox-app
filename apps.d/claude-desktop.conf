# Default app definition for claude-desktop. Copy this file into
# ~/.config/quick-distrobox-app/apps/ and edit it to override any value —
# user config always wins over this bundled default.
CONTAINER=ubuntu-dev
IMAGE=ubuntu:24.04
BIN=/usr/bin/claude-desktop
INSTALL_KIND=script
INSTALL_SCRIPT=claude-desktop.sh
DESKTOP_NAME="Claude"
COMMENT="Claude Desktop"
CATEGORIES="Office;Utility;Network;"
ICON_PATHS="/usr/share/icons/hicolor/512x512/apps/claude-desktop.png /usr/share/icons/hicolor/256x256/apps/claude-desktop.png /usr/share/pixmaps/claude-desktop.png"
NEEDS_DBUS_FIX=1
